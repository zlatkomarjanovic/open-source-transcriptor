[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcriptor"
version = "1.0.0"
description = "Local YouTube transcription CLI. Captions first, Whisper fallback. Built so agents can transcribe videos without burning chat tokens."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zlatko Marjanovic" }]
keywords = ["youtube", "transcript", "whisper", "cli", "captions"]
dependencies = [
    "yt-dlp>=2025.1.0",
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
yt-transcribe = "yt_transcriptor.cli:main"

[project.urls]
Homepage = "https://github.com/zlatkomarjanovic/open-source-transcriptor"
Repository = "https://github.com/zlatkomarjanovic/open-source-transcriptor"

[tool.setuptools.packages.find]
include = ["yt_transcriptor*"]
